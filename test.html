<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="test.css">
</head>
<body>
    <section class="article-creater">
        <section class="article-title"></section>
        <section class="article-tags"></section>
        <section class="article-keyWords"></section>
        <section class="text-editor">
            <section class="tef"> <!-- tef -->
                <div class="tef1"> 
                    <button class="tef1-italics-btn">
                        <span class="tef1-italics-span">
                            <svg><path></path></svg>
                        </span>
                    </button>
                    <button class="tef1-bold-btn">
                        <span class="tef1-bold-span">
                            <svg><path></path></svg>
                        </span>
                    </button>
                    <button class="tef1-stroke-btn">
                        <span class="tef1-stroke-span">
                            <svg><path></path></svg>
                        </span>
                    </button>
                    <button class="tef1-underline-btn">
                        <span class="tef1-underline-span">
                            <svg><path></path></svg>
                        </span>
                    </button>
                    <button class="tef1-underReg-btn">
                        <span class="tef1-underReg-span">
                            <svg><path></path></svg>
                        </span>
                    </button>
                    <button class="tef1-aboveReg-btn">
                        <span class="tef1-aboveReg-span">
                            <svg><path></path></svg>
                        </span>
                    </button>

                </div>
                <div class="tef2"></div>
                <div class="tef3"></div>
            </section>
            <div class="text-editor-content" contenteditable="true"></div>
        </section>

    </section>
    <script src="test.js"></script>
</body>
</html>
